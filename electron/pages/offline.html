<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yello</title>
  <style>
    :root {
      color-scheme: light dark;
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --text: #1a202c;
      --muted: #6b7280;
      --bg: #f9fafb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f3f4f6;
        --muted: #9ca3af;
        --bg: #111827;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    main {
      max-width: 360px;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }

    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 20px;
    }

    a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach Yello</h1>
    <p>Check your internet connection, then try again.</p>
    <a id="retry" href="#">Try again</a>
  </main>
  <script>
    // The main process passes the server URL as ?url=…
    const url = new URLSearchParams(location.search).get('url');
    if (url) document.getElementById('retry').href = url;
  </script>
</body>
</html>
