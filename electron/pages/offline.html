<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yello</title>
  <style>
    :root {
      color-scheme: light dark;
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --text: #1a202c;
      --muted: #6b7280;
      --bg: #f9fafb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f3f4f6;
        --muted: #9ca3af;
        --bg: #111827;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    main {
      max-width: 360px;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }

    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 20px;
    }

    a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      background: var(--primary-hover);
    }

    .actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a.secondary {
      background: transparent;
      color: var(--primary);
      box-shadow: inset 0 0 0 1px var(--primary);
    }

    a.secondary:hover {
      background: transparent;
      color: var(--primary-hover);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach Yello</h1>
    <p id="message">Check your internet connection, then try again.</p>
    <div class="actions">
      <a id="retry" href="#">Try again</a>
      <a id="railway" class="secondary" href="yello://server/railway" hidden>Back to Railway</a>
    </div>
  </main>
  <script>
    // The main process passes the server URL as ?url=…, and local=1 when the
    // admin switched the app to a local backend (src/serverSwitch.ts)
    const params = new URLSearchParams(location.search);
    const url = params.get('url');
    if (url) document.getElementById('retry').href = url;
    if (params.get('local') === '1') {
      document.getElementById('message').textContent =
        `The local server isn't answering at ${url || 'localhost'}. Start it with "npm run local" in the Yello folder, then try again.`;
      document.getElementById('railway').hidden = false;
    }
  </script>
</body>
</html>
